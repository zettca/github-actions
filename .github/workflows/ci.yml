name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: # Allows you to run this workflow manually
    inputs:
      customKey:
        description: "Custom thing"
        required: true
        default: "MY_VALUE_123"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Check:
    name: Check stuff
    runs-on: ubuntu-latest

    steps:
      - run: node -e 'const os=require("os");console.log(os.availableParallelism())'
      - run: git log
